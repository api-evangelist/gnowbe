aid: gnowbe
name: Gnowbe
description: Gnowbe is an AI-powered workforce enablement and performance platform for
  enterprise learning, enablement, and alignment. It turns static content and communication
  into mobile-first microlearning experiences with AI-powered activation and execution
  tracking, so teams do not just learn but perform. Trusted by 500,000+ learners across
  100+ countries, Gnowbe combines authoring, AI content creation, group-based delivery,
  completion and engagement analytics, and integrations (SSO/SAML, LMS/SCORM, xAPI/LRS,
  HR systems, Slack, Microsoft Teams, and Zapier's 5,000+ tools). Gnowbe is a portfolio
  company of 500 Global.
